name: LLM Eval Harness CI & Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Test Suite & PR Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite & Coverage Check
        run: |
          pytest tests/ -v --tb=short \
            --cov=scorer --cov=guardrails --cov=reporter \
            --cov-report=term-missing --cov-fail-under=85

      - name: Run Eval Harness with SR 11-7 MRM Generator
        run: |
          python runner.py --probe-bank probes/probe_bank.yaml --model mock \
            --mrm --institution "Enterprise Model Risk Management" \
            --output-dir eval_history

      - name: Enforce CI/CD Regression Quality Gate
        run: |
          CANDIDATE=$(ls -t eval_history/20*.json | head -1)
          echo "Evaluating Candidate: $CANDIDATE against Baseline: eval_history/baseline.json"
          python ci_gate.py "$CANDIDATE" \
            --baseline eval_history/baseline.json \
            --min-pass-rate 0.85 \
            --max-regressed 2

      - name: Upload Audit Reports & Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mrm-eval-audit-pack
          path: eval_history/
